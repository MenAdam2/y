
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adamishh</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #090b12;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 50px 20px;
}

.container {
  max-width: 480px;
  margin: 0 auto;
}

/* LOGO */

.logo {
  text-align: center;
  margin-top: 35px;
  margin-bottom: 75px;
}

.logo h1 {
  font-size: 55px;
  font-weight: 900;
  letter-spacing: -2px;
  color: #398bff;
}

.logo p {
  color: #68758c;
  font-size: 11px;
  letter-spacing: 4px;
  margin-top: 9px;
}

/* CARD */

.card {
  background: #121725;
  border: 1px solid #202b40;
  padding: 30px;
  border-radius: 24px;
}

.card h2 {
  font-size: 24px;
  margin-bottom: 10px;
}

.card .subtitle {
  color: #8994a8;
  font-size: 14px;
  margin-bottom: 25px;
}

/* INPUT */

input {
  width: 100%;
  padding: 18px;
  border-radius: 14px;
  background: #0b101b;
  border: 1px solid #283449;
  color: white;
  outline: none;
  font-size: 14px;
  transition: .2s;
}

input:focus {
  border-color: #398bff;
  box-shadow: 0 0 0 3px #398bff20;
}

input::placeholder {
  color: #657087;
}

/* BUTTON */

button {
  width: 100%;
  padding: 18px;
  margin-top: 17px;
  border: none;
  border-radius: 50px;
  background: #267df5;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  background: #4692ff;
  transform: translateY(-2px);
}

button:disabled {
  opacity: .6;
  cursor: wait;
  transform: none;
}

/* STATUS */

#status {
  color: #8d9ab0;
  text-align: center;
  font-size: 13px;
  margin-top: 20px;
  overflow-wrap: anywhere;
}

.footer {
  text-align: center;
  color: #505d72;
  font-size: 11px;
  margin-top: 35px;
}

@media(max-width: 480px) {
  .logo h1 {
    font-size: 48px;
  }

  .card {
    padding: 25px 20px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>Adamishh</h1>
    <p>SOUNDCLOUD DOWNLOADER</p>
  </div>

  <div class="card">

    <h2>Download your music</h2>

    <p class="subtitle">
      Paste your SoundCloud link below
    </p>

    <input
      type="url"
      id="url"
      placeholder="https://soundcloud.com/..."
    >

    <button id="download" onclick="downloadMusic()">
      Download MP3 ↗
    </button>

    <div id="status"></div>

  </div>

  <div class="footer">
    SIMPLE. FAST. CLEAN.
  </div>

</div>

<script>
async function downloadMusic() {
  const url = document.getElementById("url").value.trim();
  const button = document.getElementById("download");
  const status = document.getElementById("status");

  if (!url || !/^https:\/\/(www\.)?soundcloud\.com\//i.test(url)) {
    status.textContent = "Please enter a valid SoundCloud URL.";
    return;
  }

  button.disabled = true;
  status.textContent = "Checking download availability...";

  try {
    const response = await fetch("/api/download", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url })
    });

    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.error || "Download unavailable.");
    }

    const blob = await response.blob();
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = objectUrl;
    link.download = "soundcloud-download.mp3";
    link.click();

    URL.revokeObjectURL(objectUrl);
    status.textContent = "Download started!";

  } catch (error) {
    status.textContent = error.message;
  } finally {
    button.disabled = false;
  }
}
</script>

</body>
</html>
